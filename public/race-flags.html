<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Flags - Beachside Racetrack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .flags-container {
      text-align: center;
      width: 100%;
      padding: 0 2rem;
    }

    .header {
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 4rem;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
      margin-bottom: 1rem;
    }

    .header .subtitle {
      font-size: 1.5rem;
      opacity: 0.9;
    }

    .flag-display {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 4rem 2rem;
      margin-bottom: 3rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flag {
      font-size: 15rem;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-30px);
      }

      60% {
        transform: translateY(-15px);
      }
    }

    .flag.safe {
      color: #2ecc71;
      text-shadow: 0 0 30px #2ecc71;
    }

    .flag.hazard {
      color: #f39c12;
      text-shadow: 0 0 30px #f39c12;
    }

    .flag.danger {
      color: #e74c3c;
      text-shadow: 0 0 30px #e74c3c;
      animation: dangerPulse 1s infinite;
    }

    @keyframes dangerPulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    .flag.finish {
      color: #ffffff;
      text-shadow: 0 0 30px #ffffff;
      animation: finishSpin 3s infinite;
    }

    @keyframes finishSpin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .flag-label {
      font-size: 3rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 2rem;
    }

    .status-info {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .status-title {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    .status-description {
      font-size: 1.2rem;
      line-height: 1.6;
      opacity: 0.9;
    }

    .fullscreen-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 15px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .fullscreen-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 2.5rem;
      }

      .flag {
        font-size: 8rem;
      }

      .flag-label {
        font-size: 2rem;
      }

      .flag-display {
        padding: 2rem 1rem;
        min-height: 300px;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 2rem;
      }

      .flag {
        font-size: 6rem;
      }

      .flag-label {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>

  <div class="flags-container">
    <div class="header">
      <h1>🏁 Race Flags</h1>
      <p class="subtitle">Current Race Status</p>
    </div>

    <div class="flag-display">
      <div id="flagContent">
        <div class="flag danger">🚩</div>
        <div class="flag-label">Danger</div>
      </div>
    </div>

    <div class="status-info">
      <div class="status-title">What This Flag Means</div>
      <div id="flagDescription" class="status-description">
        Race is stopped. All cars must come to a complete stop immediately.
        No overtaking or racing permitted.
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;
    let gameState = {};

    const flagDescriptions = {
      safe: "Race is active. Normal racing conditions apply. Overtaking permitted.",
      hazard: "Caution - Hazard on track. Slow down, no overtaking. Be prepared to stop.",
      danger: "Race is stopped. All cars must come to a complete stop immediately. No overtaking or racing permitted.",
      finish: "Race has finished. Complete current lap and return to pits. Chequered flag displayed."
    };

    function initializeSocket() {
      socket = io();

      socket.on('gameState', (state) => {
        gameState = state;
        updateFlagDisplay();
      });
    }

    function updateFlagDisplay() {
      const flagContent = document.getElementById('flagContent');
      const flagDescription = document.getElementById('flagDescription');

      let flagSymbol = '🚩';
      let flagClass = 'danger';
      let flagText = 'Danger';

      switch (gameState.raceMode) {
        case 'safe':
          flagSymbol = '🏁';
          flagClass = 'safe';
          flagText = 'Safe';
          break;
        case 'hazard':
          flagSymbol = '⚠️';
          flagClass = 'hazard';
          flagText = 'Hazard';
          break;
        case 'finish':
          flagSymbol = '🏁';
          flagClass = 'finish';
          flagText = 'Finish';
          break;
        default:
          flagSymbol = '🚩';
          flagClass = 'danger';
          flagText = 'Danger';
      }

      flagContent.innerHTML = `
                <div class="flag ${flagClass}">${flagSymbol}</div>
                <div class="flag-label">${flagText}</div>
            `;

      flagDescription.textContent = flagDescriptions[gameState.raceMode] || flagDescriptions.danger;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error('Error attempting to enable fullscreen:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Initialize socket connection
    initializeSocket();
  </script>
</body>

</html>
