<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Receptionist Front Desk</title>
  <link rel="stylesheet" href="front-desk.css" />
</head>
<body>
  <div class="container">
    <h2>Receptionist Login</h2>
    <label for="accessKey">Access Key:</label>
    <input type="password" id="accessKey" name="accessKey" />
    <button>Login</button>

    <h2>Upcoming Race Sessions</h2>
    <ul>
      <li>Session 1</li>
      <li>Session 2</li>
    </ul>

    <h3>Add New Race Session</h3>
    <input type="text" placeholder="Session Name" />
    <button>Add Session</button>

    <h3>Drivers for Selected Session</h3>
    <ul>
      <li>Driver 1</li>
      <li>Driver 2</li>
    </ul>

    <input type="text" placeholder="Driver Name" />
    <button>Add Driver</button>
  </div>
</body>
</html>
