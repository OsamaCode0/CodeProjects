version: "2"

services:

  postgres:
    image: 'postgres:15'
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo.db
    logging:
      options:
        max-size: 10m
        max-file: "20"
    ports:
      - "5433:5432"
    volumes: 
      - ../database-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/create_tables.sql